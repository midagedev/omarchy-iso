name: Hangul ISO Build

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ISO repository
        uses: actions/checkout@v4

      - name: Checkout Omarchy source (hangul branch)
        uses: actions/checkout@v4
        with:
          repository: midagedev/omarchy
          ref: hangul
          path: omarchy-source

      - name: Checkout Omarchy packages
        uses: actions/checkout@v4
        with:
          repository: omacom-io/omarchy-pkgs
          path: omarchy-pkgs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Build ISO (local source with hangul patch)
        run: NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --local-source "$GITHUB_WORKSPACE/omarchy-source" "$GITHUB_WORKSPACE/omarchy-pkgs"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-hangul-iso
          path: ./release/*.iso
          retention-days: 3
